[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "violet"
version = "0.1.0"
description = "VIOLET: Multi-Agent RL Cyber Attack & Defense Simulator"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "VIOLET Team"}]
keywords = ["reinforcement-learning", "multi-agent", "cybersecurity", "simulation", "marl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]

dependencies = [
    "numpy>=1.26",
    "gymnasium>=0.28",
    "pettingzoo>=1.20",
    "psutil>=5.9",
]

[project.optional-dependencies]
rl = [
    "torch>=2.1",
    "ray[default]>=2.9",
    "ray[rllib]>=2.9",
]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
]
viz = [
    "matplotlib>=3.8",
]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
    "mypy>=1.8",
    "bandit>=1.7",
    "hypothesis>=6.10",
]
all = ["violet[rl,api,viz]", "violet[dev]"]

[project.scripts]
violet = "violet.cli:main"

[tool.hatch.build.targets.sources]
packages = ["backend/violet"]

[tool.ruff]
target-version = "py311"
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D", "UP", "B", "SIM", "ISC", "C4", "TCH", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-v --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.bandit]
skips = ["B101", "B608"]
exclude_dirs = ["tests", "scripts"]
