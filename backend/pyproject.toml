[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "violet"
version = "0.1.0"
description = "VIOLET: Multi-Agent RL Cyber Attack & Defense Simulator"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "VIOLET Team"}]
keywords = ["reinforcement-learning", "multi-agent", "cybersecurity", "simulation", "marl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]

dependencies = [
    "numpy>=1.26",
    "gymnasium>=0.28",
    "pettingzoo>=1.20",
    "psutil>=5.9",
]

[project.optional-dependencies]
rl = [
    "torch>=2.1",
]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "httpx>=0.27",
]
viz = [
    "matplotlib>=3.8",
]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
    "mypy>=1.8",
    "bandit>=1.7",
    "hypothesis>=6.10",
    "types-PyYAML>=6.0",
]
all = ["violet[rl,api,viz]", "violet[dev]"]

[project.scripts]
violet = "violet.cli:main"
violet-range-train = "violet.range.train_real:main"

[tool.hatch.build.targets.sources]
packages = ["backend/violet"]

[tool.ruff]
target-version = "py312"
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D", "UP", "B", "SIM", "ISC", "C4", "TC", "RUF"]
ignore = [
    "E501",
    # Policy decision (Phase 1.5): require docstring FORMAT quality (D2xx/D4xx)
    # but not blanket presence (D1xx). Writing 200+ stub docstrings across
    # tests/scripts adds no information; real quality issues stay visible.
    "D100", "D101", "D102", "D103", "D104", "D105", "D107",
]

[tool.ruff.lint.per-file-ignores]
# Tuple-unpacking into named locals is idiomatic in PettingZoo tests; unused
# unpacks there are not defects.
"tests/*" = ["RUF059", "B007"]
# TypeAlias syntax keeps the package importable on its declared Python 3.11 floor.
"violet/range/contracts.py" = ["UP040"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
# The project runtime is Python 3.12; pinning mypy to the same version keeps
# stdlib/3rd-party stubs (e.g. numpy 2.x `type` statements) analyzable.
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true
warn_unused_configs = true

# PettingZoo ships no py.typed marker or usable stubs; do not weaken checks
# anywhere else because of it.
[[tool.mypy.overrides]]
module = "pettingzoo.*"
ignore_missing_imports = true

# Test suites keep every strict check EXCEPT the require-annotations rules —
# asserting shapes in plain test functions is normal practice and annotating
# hundreds of test helpers adds no safety. The violet package itself stays fully strict.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.bandit]
skips = ["B101", "B608"]
exclude_dirs = ["tests", "scripts"]
